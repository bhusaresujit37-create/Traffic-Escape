<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Escape</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:Arial,sans-serif;overflow:hidden;user-select:none}
#game{position:relative;width:400px;height:700px;margin:auto;background:#333;overflow:hidden;border-left:8px solid #555;border-right:8px solid #555}
.road{position:absolute;width:100%;height:100%;background:#333}
.line{position:absolute;width:8px;height:80px;background:white;left:50%;transform:translateX(-50%)}
.line1{top:-100px}.line2{top:120px}.line3{top:340px}.line4{top:560px}
#player{position:absolute;width:50px;height:90px;bottom:30px;left:175px;background:#2196f3;border-radius:10px;box-shadow:0 0 15px #2196f3;z-index:10}
#player::before{content:"";position:absolute;width:32px;height:25px;background:#bdefff;left:9px;top:10px;border-radius:5px}
.enemy{position:absolute;width:50px;height:90px;border-radius:10px;z-index:5}
.enemy::before{content:"";position:absolute;width:32px;height:25px;background:#ddd;left:9px;top:10px;border-radius:5px}
#hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;color:white;font-size:18px;font-weight:bold;z-index:20}
.coin{position:absolute;width:25px;height:25px;background:gold;border:3px solid #ff9800;border-radius:50%;z-index:6}
#gameOver{position:absolute;inset:0;background:rgba(0,0,0,.85);color:white;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:100}
#gameOver h1{color:#ff3333;font-size:42px;margin-bottom:15px}
button{border:none;padding:12px 25px;margin-top:15px;border-radius:8px;font-size:18px;cursor:pointer;background:#2196f3;color:white}
#controls{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:20px}
.control{width:70px;height:55px;background:rgba(255,255,255,.2);color:white;border:2px solid white;border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:28px}
@media(min-width:700px){#controls{display:none}}
</style>
</head>
<body>
<div id="game">
<div class="road"></div>
<div class="line line1"></div><div class="line line2"></div><div class="line line3"></div><div class="line line4"></div>
<div id="hud"><div>Score: <span id="score">0</span></div><div>❤️ <span id="lives">3</span></div></div>
<div id="player"></div>
<div id="gameOver"><h1>GAME OVER</h1><p>Final Score: <span id="finalScore">0</span></p><button onclick="restartGame()">PLAY AGAIN</button></div>
</div>
<div id="controls"><div class="control" id="left">⬅️</div><div class="control" id="right">➡️</div></div>

<script>
const game=document.getElementById("game"),player=document.getElementById("player");
const scoreText=document.getElementById("score"),livesText=document.getElementById("lives");
let playerX=175,score=0,lives=3,speed=5,gameRunning=true,enemies=[],coins=[],keys={};
document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
let movingLeft=false,movingRight=false;
left.addEventListener("touchstart",()=>movingLeft=true);left.addEventListener("touchend",()=>movingLeft=false);
right.addEventListener("touchstart",()=>movingRight=true);right.addEventListener("touchend",()=>movingRight=false);

function createEnemy(){
 if(!gameRunning)return;
 const enemy=document.createElement("div");enemy.classList.add("enemy");
 const colors=["#e53935","#9c27b0","#ff9800","#4caf50","#f44336"];
 enemy.style.background=colors[Math.floor(Math.random()*colors.length)];
 const lanes=[70,175,280],lane=lanes[Math.floor(Math.random()*lanes.length)];
 enemy.style.left=lane+"px";enemy.style.top="-100px";game.appendChild(enemy);
 enemies.push({element:enemy,x:lane,y:-100});
}
function createCoin(){
 if(!gameRunning)return;
 const coin=document.createElement("div");coin.classList.add("coin");
 const lanes=[82,187,292],lane=lanes[Math.floor(Math.random()*lanes.length)];
 coin.style.left=lane+"px";coin.style.top="-30px";game.appendChild(coin);
 coins.push({element:coin,x:lane,y:-30});
}
function collision(a,b){return !(a.right<b.left||a.left>b.right||a.bottom<b.top||a.top>b.bottom)}
function gameLoop(){
 if(!gameRunning)return;
 if(keys["arrowleft"]||keys["a"]||movingLeft)playerX-=7;
 if(keys["arrowright"]||keys["d"]||movingRight)playerX+=7;
 if(playerX<15)playerX=15;if(playerX>335)playerX=335;
 player.style.left=playerX+"px";
 document.querySelectorAll(".line").forEach(line=>{
  let top=parseInt(getComputedStyle(line).top);top+=speed;if(top>700)top=-100;line.style.top=top+"px";
 });
 enemies.forEach((enemy,index)=>{
  enemy.y+=speed;enemy.element.style.top=enemy.y+"px";
  const pRect=player.getBoundingClientRect(),eRect=enemy.element.getBoundingClientRect();
  if(collision(pRect,eRect)){
   enemy.element.remove();enemies.splice(index,1);lives--;livesText.textContent=lives;if(lives<=0)endGame();
  }
  if(enemy.y>750){
   enemy.element.remove();enemies.splice(index,1);score+=10;scoreText.textContent=score;
   if(score%100===0)speed+=1;
  }
 });
 coins.forEach((coin,index)=>{
  coin.y+=speed;coin.element.style.top=coin.y+"px";
  const pRect=player.getBoundingClientRect(),cRect=coin.element.getBoundingClientRect();
  if(collision(pRect,cRect)){
   coin.element.remove();coins.splice(index,1);score+=25;scoreText.textContent=score;
  }
  if(coin.y>750){coin.element.remove();coins.splice(index,1)}
 });
 requestAnimationFrame(gameLoop);
}
function endGame(){gameRunning=false;document.getElementById("finalScore").textContent=score;document.getElementById("gameOver").style.display="flex"}
function restartGame(){location.reload()}
setInterval(()=>{if(gameRunning)createEnemy()},1000);
setInterval(()=>{if(gameRunning)createCoin()},1800);
gameLoop();
</script>
</body>
</html>
